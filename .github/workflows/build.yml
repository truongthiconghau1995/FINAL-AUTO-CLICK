name: Build AutoClicker EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/python-versions@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyautogui pyperclip pynput pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "AutoClicker_F11_F12" multi_step_autoclicker.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoClicker_Executable
        path: dist/AutoClicker_F11_F12/
